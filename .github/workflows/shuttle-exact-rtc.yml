name: Shuttle exact already-attested RTC archive
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rtc-exact-archive-shuttle
  cancel-in-progress: false

jobs:
  shuttle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the exact source artifact and split unchanged inner archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $root=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'out/rtc-shuttle'))
          if (!$root.StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Controlled shuttle files must stay on D:' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $api='https://api.github.com/repos/donle/GameBridge-libwebrtc-builder'
          try {
            $run=Invoke-RestMethod "$api/actions/runs/35546343039" -Headers $headers
            if ($run.id -ne 35546343039 -or $run.run_attempt -ne 1 -or $run.head_sha -cne 'f60d031a9456f24464de9f635ab5bd29b26eacb2' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/build-libwebrtc.yml') { throw 'Source run mismatch' }
            $artifact=Invoke-RestMethod "$api/actions/artifacts/10617117642" -Headers $headers
            if ($artifact.id -ne 10617117642 -or $artifact.expired -or $artifact.name -cne 'gamebridge-rtc-libwebrtc-f60d031a9456f24464de9f635ab5bd29b26eacb2' -or $artifact.size_in_bytes -ne 26848720 -or $artifact.workflow_run.id -ne 35546343039) { throw 'Source artifact mismatch' }
            $outer=Join-Path $root 'original-transport.zip'
            Invoke-WebRequest "$api/actions/artifacts/10617117642/zip" -Headers $headers -OutFile $outer
          } catch { throw 'Exact source-run artifact fetch or identity verification failed' }
          $headers=$null
          if ((Get-Item -LiteralPath $outer).Length -ne 26848720) { throw 'Original transport size mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead($outer)
          try {
            $names=@($zip.Entries.FullName)
            if ($names.Count -ne 2 -or (Compare-Object @('gamebridge-rtc-windows-x64.zip','SHA256SUMS') $names -CaseSensitive)) { throw 'Unexpected original transport entries' }
            $entry=$zip.GetEntry('gamebridge-rtc-windows-x64.zip')
            if ($entry.Length -lt 1 -or $entry.Length -gt 268435456) { throw 'Original archive size out of bounds' }
            $archive=Join-Path $root 'gamebridge-rtc-windows-x64.zip'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$archive,$false)
            $sums=$zip.GetEntry('SHA256SUMS')
            if ($sums.Length -gt 128) { throw 'Original checksum manifest size mismatch' }
            $reader=[IO.StreamReader]::new($sums.Open())
            try { $line=$reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($line -cne '7cd8ff9a5a59e8d2c7a15440ebbefc320b2d26019529c16e6e250e93f647c4d8  gamebridge-rtc-windows-x64.zip') { throw 'Original checksum manifest mismatch' }
          } finally { $zip.Dispose() }
          $expected='7cd8ff9a5a59e8d2c7a15440ebbefc320b2d26019529c16e6e250e93f647c4d8'
          if ((Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -cne $expected) { throw 'Exact hosted archive SHA256 mismatch' }
          $inputFile=[IO.File]::OpenRead($archive)
          $parts=[Collections.Generic.List[object]]::new()
          try {
            for ($index=0; $inputFile.Position -lt $inputFile.Length; $index++) {
              if ($index -ge 64) { throw 'Shuttle shard count exceeded' }
              $name='{0:D3}.bin' -f $index
              $path=Join-Path $root $name
              $length=[int][Math]::Min(458752,$inputFile.Length-$inputFile.Position)
              $bytes=New-Object byte[] $length
              $read=0
              while ($read -lt $length) {
                $count=$inputFile.Read($bytes,$read,$length-$read)
                if ($count -eq 0) { throw 'Unexpected archive EOF' }
                $read += $count
              }
              [IO.File]::WriteAllBytes($path,$bytes)
              $parts.Add([ordered]@{index=$index;name=$name;size=$length;sha256=(Get-FileHash -LiteralPath $path).Hash.ToLowerInvariant()})
            }
          } finally { $inputFile.Dispose() }
          $manifest=[ordered]@{schema=1;source_repository='donle/GameBridge-libwebrtc-builder';source_run_id=35546343039;source_attempt=1;source_revision='f60d031a9456f24464de9f635ab5bd29b26eacb2';source_artifact_id=10617117642;outer_size=26848720;outer_sha256=(Get-FileHash -LiteralPath $outer).Hash.ToLowerInvariant();archive_sha256=$expected;archive_size=(Get-Item -LiteralPath $archive).Length;transport_run_id=$env:GITHUB_RUN_ID;transport_attempt=$env:GITHUB_RUN_ATTEMPT;transport_revision=$env:GITHUB_SHA;shards=@($parts.ToArray())}
          [IO.File]::WriteAllText((Join-Path $root 'manifest.json'),($manifest|ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
          Write-Output "PASS unchanged original archive; shards=$($parts.Count), archive_sha256=$expected"
      - name: Upload transport manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtc-shuttle-manifest
          path: out/rtc-shuttle/manifest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload shard 000
        if: ${{ success() && hashFiles('out/rtc-shuttle/000.bin') != '' }}
